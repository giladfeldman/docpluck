[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docpluck"
version = "2.4.126"
description = "PDF, DOCX, and HTML text extraction and normalization for academic papers"
readme = "docs/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gilad Feldman", email = "giladfeld@gmail.com"},
]
keywords = [
    "pdf", "docx", "html", "extraction", "normalization", "academic",
    "statistics", "text-mining", "research", "psychology", "meta-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pdfplumber>=0.11.0",
    # Camelot is the table-extraction engine (per memory
    # `project_camelot_for_tables` — settled 2026-05-09 after a 5-library
    # bake-off). [cv] extra pulls in opencv-python which Camelot's lattice
    # flavor needs for line detection. Without this dep, the `import camelot`
    # in tables/camelot_extract.py raises ImportError, the wrapper silently
    # returns [], and every detected table caption becomes kind='isolated'
    # with empty cells — exactly the v2.4.12 production regression.
    # Upper bound: 2.x is verified (v2.4.88 handles its Windows temp-handle
    # behavior, see LESSONS L-008); cap below the next breaking major so a 3.0
    # can't silently drift in and re-zero table extraction. Bump deliberately
    # after re-verifying the corpus render.
    "camelot-py[cv]>=0.11.0,<3.0",
    # Lattice flavor also needs Ghostscript at runtime — the system binary,
    # installed via Dockerfile (apt-get install ghostscript). Without it,
    # lattice silently fails and only the (often noisier) stream flavor
    # contributes to detection.
]

[project.optional-dependencies]
docx = ["mammoth>=1.8.0"]
html = ["beautifulsoup4>=4.12.0", "lxml>=5.0.0"]
all = ["mammoth>=1.8.0", "beautifulsoup4>=4.12.0", "lxml>=5.0.0"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "rapidfuzz>=3",
    "anyio>=4",
    "pytest-anyio>=0.0.0",
    "mammoth>=1.8.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-docx>=1.0.0",
    "pytest-xdist>=3",
]

[project.scripts]
docpluck = "docpluck.cli:main"

[project.urls]
Homepage = "https://docpluck.app"
Documentation = "https://docpluck.app/api-docs"
Repository = "https://github.com/giladfeldman/docpluck"
Issues = "https://github.com/giladfeldman/docpluck/issues"
Changelog = "https://github.com/giladfeldman/docpluck/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["docpluck"]

# 2026-08-05 (run 6): the project had NO pytest configuration at all, so a bare
# `pytest` walked the whole working tree — including `tmp/`, the scratch
# directory every iterate run fills with one-off probes. Six scratch files
# there matched pytest's default discovery globs (`a2_rule_test.py`,
# `cycle2_test.py`, `extract_test.py`, `test_majumder_head.py`,
# `test_w0d_efendic.py`, `test_w0d_why.py`), producing 10 collection ERRORs
# and — worse — making the suite's TEST COUNT depend on whatever debris the
# last session happened to leave behind.
#
# That defeats the project's "a shrinking test count is a failure, not a pass"
# tripwire: run 5 recorded 1962 tests and run 6 saw 2295, and neither number
# was comparable to the other because the delta was mostly scratch files, not
# real coverage. Pinning `testpaths` makes the count a property of `tests/`
# alone, so it can be compared across runs and a genuine drop is meaningful.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "tmp",
    "build",
    "dist",
    ".git",
    "*.egg-info",
    "scripts",
    "docs",
]
